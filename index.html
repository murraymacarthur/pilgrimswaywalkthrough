function makeNoise(seed){

  return (x,y,px,py)=>{const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
    const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
    const X0=((xi%px)+px)%px,X1=(X0+1)%px,Y0=((yi%py)+py)%py,Y1=(Y0+1)%py;
    const h=(a,b)=>g[p[p[a&255]+(b&255)]];
    const a=h(X0,Y0),b=h(X1,Y0),c=h(X0,Y1),d=h(X1,Y1);
    return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;};
}

// Side grain: u = along grain (2000 mm), v = across (500 mm)
function oakSide(){

// End grain: concentric rings round an off-centre pith, rays and radial checks (tile = 400 mm)
function oakEnd(){

function noiseTex(W,base,spread,count,size,seed,repeatPx){SEED=seed;const c=document.createElement('canvas');c.width=c.height=W;const x=c.getContext('2d');

/* Grain-aligned UVs; end faces split into material group 1 */
function grainUVs(mesh,unit,rnd){
  let g=mesh.geometry; if(g.index)g=g.toNonIndexed();
  const P=g.attributes.position, N=P.count;

/* ================= Garden ================= */

  reset(); hud.textContent='Click to start'; document.getElementById('go').textContent='Click to walk in.';
  if(location.hash){const [x,y,z,lx,ly,lz]=location.hash.slice(1).split(',').map(Number);start.style.display='none';
    camera.position.set(centre.x+x,y,centre.z+z);camera.lookAt(centre.x+lx,ly,centre.z+lz);}
},undefined,e=>{document.querySelector('#start .box').textContent='Failed to load model: '+(e.message||e)});
},50);

/* ================= Walking ================= */
const controls=new PointerLockControls(camera,document.body);
const start=document.getElementById('start');
start.onclick=()=>controls.lock();
controls.addEventListener('lock',()=>start.style.display='none');
controls.addEventListener('unlock',()=>start.style.display='flex');

const keys={}; let fly=false, collide=true, vy=0, feet=0, onGround=true;
function reset(){feet=0;camera.position.set(spawn.x,EYE,spawn.z);camera.lookAt(centre.x,EYE,centre.z);vy=0;}
addEventListener('keydown',e=>{keys[e.code]=true;
  if(e.code==='KeyF'){fly=!fly;vy=0;} if(e.code==='KeyC')collide=!collide; if(e.code==='KeyR')reset();
  if(e.code==='KeyO')useAO=!useAO;
  if(e.code==='BracketLeft'){sunElev=Math.max(-3,sunElev-2);placeSun();}
  if(e.code==='BracketRight'){sunElev=Math.min(60,sunElev+2);placeSun();}
  if(e.code==='Space'&&onGround&&!fly){vy=4;onGround=false;} if(e.ctrlKey||e.code==='Space')e.preventDefault();});
addEventListener('keyup',e=>keys[e.code]=false);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer&&composer.setSize(innerWidth,innerHeight);});

const ray=new THREE.Raycaster(), down=new THREE.Vector3(0,-1,0), o=new THREE.Vector3(), fwd=new THREE.Vector3(), right=new THREE.Vector3();
function blocked(x,y,z,dir,dist){ray.set(o.set(x,y,z),dir);ray.far=dist+RADIUS;return ray.intersectObjects(colliders,false).length>0;}
function groundAt(x,z,fromY){ray.set(o.set(x,fromY+0.45,z),down);ray.far=fromY+50;const h=ray.intersectObjects(colliders,false)[0];return h?Math.max(0,h.point.y):0;}

function tick(){
  const dt=Math.min(clock.getDelta(),0.05); grassUniform.value+=dt; if(waterTex){waterTex.offset.x+=dt*0.02;waterTex.offset.y+=dt*0.013;}
  if(controls.isLocked){
    const crouch=keys.ControlLeft||keys.ControlRight, eye=crouch?CROUCH:EYE;
    const sp=(keys.ShiftLeft||keys.ShiftRight?RUN:WALK)*(fly?2:1)*(crouch?0.5:1);
    camera.getWorldDirection(fwd); if(!fly)fwd.y=0; fwd.normalize(); right.crossVectors(fwd,camera.up).normalize();
    const mv=new THREE.Vector3();
    if(keys.KeyW)mv.add(fwd); if(keys.KeyS)mv.sub(fwd); if(keys.KeyD)mv.add(right); if(keys.KeyA)mv.sub(right);
    if(fly){if(keys.KeyE)mv.y+=1; if(keys.KeyQ)mv.y-=1;}
    const p=camera.position;
    if(mv.lengthSq()>0){mv.normalize().multiplyScalar(sp*dt);
      if(collide&&!fly){
        for(const ax of ['x','z']){if(!mv[ax])continue;const d=new THREE.Vector3();d[ax]=Math.sign(mv[ax]);
          const hit=[0.5,1.0,eye-0.05].some(h=>blocked(p.x,feet+h,p.z,d,Math.abs(mv[ax])));
          if(!hit)p[ax]+=mv[ax];}
      } else p.add(mv);
    }
    if(fly){feet=p.y-eye;}
    else{vy-=G*dt; feet+=vy*dt;
      const gY=collide?groundAt(p.x,p.z,feet):0;
      if(feet<=gY){feet=gY;vy=0;onGround=true;} else onGround=false;
      p.y=feet+eye;}
    hud.textContent=`X ${(p.x*1000).toFixed(0)}  Y ${(-p.z*1000).toFixed(0)}  Eye ${(p.y*1000).toFixed(0)} mm\n`+
      `Frame ${sizeMM.x.toFixed(0)} × ${sizeMM.z.toFixed(0)} × ${sizeMM.y.toFixed(0)} mm (h)\n`+
      `${fly?'FLY':'WALK'} · collisions ${collide?'on':'off'} · AO ${useAO?'on':'off'} · sun ${sunElev}°`;
  }
  sky.position.copy(camera.position);
  if(composer&&useAO)composer.render(); else renderer.render(scene,camera);
}
renderer.setAnimationLoop(tick);
</script></body></html>
